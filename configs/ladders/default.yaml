# Model ladder for `rightsize sweep`, cheapest first. Each rung is a model plus the params sent with it.
# Current Claude models take `effort` (low..max), not temperature; Haiku 4.5 still takes temperature.
# Local rungs assume an OpenAI-compatible server reachable by the system under test.
rungs:
  - {name: qwen2.5-7b,            model: "qwen2.5:latest",  params: {temperature: 0}}
  - {name: haiku-4.5,             model: claude-haiku-4-5,  params: {temperature: 0}}
  - {name: sonnet-5.5@low,        model: claude-sonnet-5-5, params: {effort: low}}
  - {name: sonnet-5.5@high,       model: claude-sonnet-5-5, params: {effort: high}}
  - {name: opus-5.5@low,          model: claude-opus-5-5,   params: {effort: low}}
  - {name: opus-5.5@medium,       model: claude-opus-5-5,   params: {effort: medium}}
  - {name: fable-5.1@low,         model: claude-fable-5-1,  params: {effort: low}}
  - {name: fable-5.1@high,        model: claude-fable-5-1,  params: {effort: high}}
