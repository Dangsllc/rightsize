# Local models against hosted ones, cheapest first, for `rightsize sweep --system ref:llm`.
# Each rung routes its own provider through params, so one sweep mixes LM Studio, Ollama, and the
# Anthropic API. Local servers answer one request at a time: those rungs run at concurrency 1.
#
# Before a sweep, load each LM Studio model with a context that fits the longest prompt:
#   lms load qwen2.5-7b-instruct --context-length 32768
# and put LM_API_TOKEN (LM Studio) and ANTHROPIC_API_KEY in .env.
#
# Every rung runs the same prompt (neutral; leave RIGHTSIZE_SKILLS_DIR unset) and mode=spec.
# Opus writes the m2 agreements, so no Opus rung appears here.
rungs:
  - name: qwen2.5-7b@lmstudio
    model: qwen2.5-7b-instruct
    concurrency: 1
    params: {provider: openai, base_url: "http://127.0.0.1:1234/v1", api_key_env: LM_API_TOKEN,
             temperature: 0, max_tokens: 8000, mode: spec}
  - name: qwen3.5-9b@lmstudio
    model: qwen/qwen3.5-9b
    concurrency: 1
    params: {provider: openai, base_url: "http://127.0.0.1:1234/v1", api_key_env: LM_API_TOKEN,
             temperature: 0, max_tokens: 16000, mode: spec}
  - name: deepseek-r1-32b@ollama
    model: "deepseek-r1:32b"
    concurrency: 1
    params: {provider: ollama, num_ctx: 32768, temperature: 0, mode: spec}
  # Haiku 4.5 takes temperature and no effort; Haiku 5.5 and Sonnet 5.5 take effort and no temperature.
  - {name: haiku-4.5,         model: claude-haiku-4-5,  params: {provider: anthropic, temperature: 0, mode: spec}}
  - {name: haiku-5.5@low,     model: claude-haiku-5-5,  params: {provider: anthropic, effort: low, mode: spec}}
  - {name: haiku-5.5@medium,  model: claude-haiku-5-5,  params: {provider: anthropic, effort: medium, mode: spec}}
  - {name: sonnet-5.5@low,    model: claude-sonnet-5-5, params: {provider: anthropic, effort: low, mode: spec}}
  - {name: sonnet-5.5@medium, model: claude-sonnet-5-5, params: {provider: anthropic, effort: medium, mode: spec}}
