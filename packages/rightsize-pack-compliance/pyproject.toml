[project]
name = "rightsize-pack-compliance"
version = "0.1.0"
description = "Compliance task pack for Rightsize (public-domain HIPAA / CFR data)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["rightsize-core", "httpx>=0.27", "lxml>=5"]

[project.entry-points."rightsize.packs"]
compliance = "rightsize_pack_compliance.pack:PACK"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rightsize_pack_compliance"]

[tool.uv.sources]
rightsize-core = { workspace = true }
