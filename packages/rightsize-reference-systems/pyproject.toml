[project]
name = "rightsize-reference-systems"
version = "0.1.0"
description = "Reference systems (bm25, dense, llm) that implement the rightsize/v1 protocol"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["rightsize-core", "rightsize-pack-compliance", "rank-bm25>=0.2.2", "fastapi>=0.110", "uvicorn>=0.29", "anthropic>=1.0"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rightsize_reference_systems"]

[tool.uv.sources]
rightsize-core = { workspace = true }
rightsize-pack-compliance = { workspace = true }
