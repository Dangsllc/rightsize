[project]
name = "rightsize-ui"
version = "0.1.0"
description = "The Rightsize Workbench: a local web UI for runs, sweeps, calibration, and guarded launches"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["rightsize-core", "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rightsize_ui"]

[tool.uv.sources]
rightsize-core = { workspace = true }
