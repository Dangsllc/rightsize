[project]
name = "rightsize-core"
version = "0.1.0"
description = "Domain-agnostic benchmark core: task schema, runner, scorers, statistics, conformance, reports"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6",
  "httpx>=0.27",
  "jsonpath-ng>=1.6",
  "jinja2>=3.1",
  "numpy>=1.26",
  "mcp>=1.2",
]


[project.scripts]
rightsize = "rightsize_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rightsize_core"]
